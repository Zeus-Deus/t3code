<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quote Pad</title>
    <style>
      /* T3 Code sets these variables on <html> through the plugin bridge (window.t3). */
      :root {
        --bg: var(--color-background-primary, #ffffff);
        --fg: var(--color-text-primary, #111113);
        --muted: var(--color-text-secondary, #6b6b73);
        --input: var(--color-border-secondary, #d6d6da);
        --ring: var(--color-ring-primary, #6b6bff);
        --danger: var(--color-text-danger, #c2410c);
        --radius: var(--border-radius-md, 8px);
        color-scheme: light dark;
      }
      html[data-t3-theme="dark"] {
        --bg: var(--color-background-primary, #0f0f11);
        --fg: var(--color-text-primary, #ededef);
        --muted: var(--color-text-secondary, #9a9aa3);
        --input: var(--color-border-secondary, #303036);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 var(--font-sans, ui-sans-serif, system-ui, sans-serif);
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 8px;
        height: 100%;
        padding: 12px;
      }
      .target {
        color: var(--muted);
        font-size: 12px;
      }
      textarea {
        flex: 1;
        min-height: 120px;
        resize: none;
        padding: 8px 10px;
        border: 1px solid var(--input);
        border-radius: var(--radius);
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 1px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .status {
        min-width: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .status.error {
        color: var(--danger);
      }
      button {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--fg);
        border-radius: calc(var(--radius) - 2px);
        background: var(--fg);
        color: var(--bg);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="target" id="target">Connecting…</div>
      <textarea
        id="text"
        maxlength="8000"
        placeholder="Draft a quote or note…"
        aria-label="Quote text"
      ></textarea>
      <div class="row">
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <button type="button" id="insert" disabled>Insert into composer</button>
      </div>
    </main>
    <script>
      (function () {
        "use strict";
        // No <form>: the view's sandbox has no allow-forms, so submit events never fire.
        var bridge = window.t3;
        var text = document.getElementById("text");
        var insert = document.getElementById("insert");
        var target = document.getElementById("target");
        var status = document.getElementById("status");
        var hasThread = false;
        var busy = false;

        function setStatus(message, isError) {
          status.textContent = message || "";
          status.className = isError ? "status error" : "status";
        }
        function update() {
          insert.disabled = busy || !hasThread || text.value.trim() === "";
        }
        function applyContext(context) {
          hasThread = Boolean(context && context.thread);
          target.textContent = hasThread
            ? "Inserts into the composer of the thread beside this panel."
            : "Open Quote Pad beside a thread to insert into its composer.";
          update();
        }
        function send() {
          if (insert.disabled) return;
          busy = true;
          update();
          setStatus("");
          bridge
            .invoke("insert", { text: text.value })
            .then(function (result) {
              setStatus((result && result.message) || "Inserted.", false);
              text.value = "";
            })
            .catch(function (error) {
              setStatus(error.message || "Could not insert the text.", true);
            })
            .then(function () {
              busy = false;
              update();
              text.focus();
            });
        }

        if (!bridge) {
          target.textContent = "Open this view inside T3 Code.";
          return;
        }
        text.addEventListener("input", update);
        text.addEventListener("keydown", function (event) {
          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
            event.preventDefault();
            send();
          }
        });
        insert.addEventListener("click", send);
        bridge.ready.then(applyContext);
        bridge.onContext(applyContext);
      })();
    </script>
  </body>
</html>
